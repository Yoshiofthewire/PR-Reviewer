name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (individually; linting together previously masked a real SC2034)
        run: |
          for f in pr-reviewer.sh lib/review-core.sh test_pr_reviewer.sh install.sh verify_isolation.sh; do
            shellcheck -S warning "$f"
          done
      - run: ./test_pr_reviewer.sh
